esphome:
  name: meshtastic
  friendly_name: meshtastic

esp32:
  board: lolin32_lite
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

external_components:
  - source: github://Andrik45719/esphome-meshtastic@main
    components: [meshtastic]
    refresh: 24h

logger:

api:
  encryption:
    key: "your_api_key_if_needed"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  output_power: 9dB
  min_auth_mode: WPA2
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: meshtastic
    password: !secret wifi_password

captive_portal:

web_server:
  
# Configure SPI for LoRa radio
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

# Configure LoRa radio (SX1276 example)
sx127x:
  id: lora_radio
  cs_pin: GPIO5
#  busy_pin: GPIO32
  dio0_pin: GPIO4
  rst_pin: GPIO17
  frequency: 868.825MHz
  spreading_factor: 9
  bandwidth: 250_0kHz
  coding_rate: CR_4_5
  modulation: LORA
  preamble_size: 6
  sync_value: 0x34
  rx_start: true
  crc_enable: true
  pa_power: 17
  pa_pin: BOOST
  
# Configure Meshtastic component
meshtastic:
  - id: mesh_node
    lora: lora_radio
    hw_model: 39  # DIY_V1
    hop_limit: 7
    ok_to_mqtt: true

    # Configure channels
    channels:
      - name: MediumFast
        psk: "AQ=="
      - name: EKB
        psk: "BQ=="
      - name: FLOOD
        psk: "SQ=="

    # Configure this node
    nodes:
      - node_number: 00000000 #change to autogenerated at first boot
        name: "Node name"
        short_name: "Node short name"
        private_key: !secret node_private_key
        public_key: !secret node_public_key
    position:
      latitude:  AA.BBBB
      longitude: CC.DDDD
      altitude: EEEE
      broadcast_interval: 3h
    # Handle received packets
    on_packet:
      then:
        - lambda: |-
            ESP_LOGD("mesh", "Packet from %08X to %08X, port %d", from, to, portnum);

# Send text messages via button press
button:
  - platform: template
    id: door
    name: "Door open"
    on_press:
      then:
        - meshtastic.send_text_message:
            id: mesh_node
            channel: #name of yours private channel
            text: "Door open"
  - platform: template
    id: waterleak
    name: "Water leak on kitchen"
    on_press:
      then:
        - meshtastic.send_text_message:
            id: mesh_node
            channel: #name of yours private channel
            text: "Water leak on kitchen"

  - platform: restart
    name: "Restart"

binary_sensor:
  - platform: status
    name: "Status"

sensor:
  - platform: wifi_signal

time:
  - platform: homeassistant
    name: "RSSI level"
    update_interval: 180s
